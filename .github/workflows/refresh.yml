# Daily price refresh (step 9). Re-resolves every record with fresh hourly prices (frozen entries
# and resolved exits kept), refetches candles, rebuilds the bundle, runs every check, and only then
# commits. Any failed fetch, check or guard stops the job before the commit reaches main, so the
# last good data stays live.
#
# main is protected (required check "guard", no force push, no deletion). The job runs the same
# guard (tools/guard.py --history and --tree) on its own commit, records that result as the
# "guard" commit status on exactly that commit, and fast-forwards main to it. Nothing about the
# protection is relaxed.
name: refresh
on:
  schedule:
    - cron: "20 21 * * *"   # daily 21:20 UTC, after the US cash close
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # push the data commit
      statuses: write   # record the guard result on that commit
      pages: write      # request the Pages rebuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: install jsonschema
        run: python3 -m pip install --quiet jsonschema==4.10.3 pillow==11.3.0 numpy==2.3.4
      - name: refresh records (fresh prices, frozen values kept)
        run: python3 refresh.py
      - name: early signals - today's price and the peak (the first post and the then-price stay frozen; non-blocking)
        run: |
          python3 tools/first_mention.py refresh || echo "early-signal refresh failed, yesterday's values stay"
      - name: BTC daily bars for the market regimes (completed bars appended; a changed stored bar is refused; non-blocking)
        run: |
          python3 tools/regimes.py fetch || echo "btc daily fetch refused or failed: yesterday's bars stay, regimes are labelled from them"
      - name: rebuild the chart bundle
        run: python3 build_chart.py
      - name: reply-context page (offline, stored contexts and their OCR caches; binds the new charts.json)
        run: python3 tools/context_page.py
      - name: refetch candles + entry-bar check
        run: python3 fetch_ohlc.py
      - name: refresh episode prices (bars up to each episode stay frozen)
        run: python3 tools/episode.py --refresh
      - name: weekly venue re-check of every ticker (Mondays; non-blocking, never swaps a venue)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python3 tools/recheck_tickers.py || echo "ticker re-check failed (provider unavailable): flags unchanged, the refresh continues"
          fi
          python3 tools/coins_page.py
      - name: checks and tests
        run: |
          python3 check_bundle.py
          python3 validate_records.py
          python3 parity.py
          python3 -m unittest tests.test_resolve tests.test_ingest_detect tests.test_guard tests.test_refresh tests.test_static tests.test_lifecycle tests.test_history tests.test_rating tests.test_add_call tests.test_scan_caller tests.test_read_images tests.test_call_context tests.test_transcript tests.test_episode_intake tests.test_tickers tests.test_seed tests.test_early tests.test_watch tests.test_spot_dex tests.test_labels tests.test_regimes tests.test_context
      - name: commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records data/refresh_log.json data/tickers.json data/btc_daily.json web sources/episodes sources/tickers sources/early
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          AS_OF=$(python3 -c 'import json; print(json.load(open("data/refresh_log.json"))["refreshed_at"])')
          git commit -q -m "refresh: prices as of $AS_OF"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: guard the new commit
        if: steps.commit.outputs.changed == 'true'
        run: |
          python3 tools/guard.py --history
          python3 tools/guard.py --tree
      - name: record the guard result and fast-forward main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          git push --force origin "HEAD:refs/heads/refresh-staging"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d '{"state":"success","context":"guard","description":"tools/guard.py history + tree: 0 hits (refresh job)"}'
          git push origin "HEAD:main"
          git push origin --delete refresh-staging
      - name: request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages/builds"
