name: probe26
# step 26, temporary (branch step26 only, removed before merge): can GitHub's runners reach the new price sources?
# (step 23 lesson: Bybit answered this server but HTTP 403 to the runners)
on:
  push:
    branches: [step26]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: hyperliquid spot meta + KNTQ/USDC hourly candles
        run: |
          curl -s -o /dev/null -w "spotMetaAndAssetCtxs HTTP %{http_code}\n" -X POST https://api.hyperliquid.xyz/info -H 'Content-Type: application/json' -d '{"type":"spotMetaAndAssetCtxs"}'
          now=$(($(date +%s)*1000)); curl -s -X POST https://api.hyperliquid.xyz/info -H 'Content-Type: application/json' -d "{\"type\":\"candleSnapshot\",\"req\":{\"coin\":\"@334\",\"interval\":\"1h\",\"startTime\":$((now-86400000)),\"endTime\":$now}}" | python3 -c "import sys,json;c=json.load(sys.stdin);print('candles @334', len(c), c[-1]['c'] if c else None)"
      - name: geckoterminal pools + hourly candles of the NEST/WHYPE pool
        run: |
          curl -s -o /dev/null -w "pools HTTP %{http_code}\n" "https://api.geckoterminal.com/api/v2/networks/hyperevm/tokens/0x07c57e32a3c29d5659bda1d3efc2e7bf004e3035/pools?page=1"
          curl -s "https://api.geckoterminal.com/api/v2/networks/hyperevm/pools/0x535f30f50ebda33575242c38b976e681d13db6fa/ohlcv/hour?aggregate=1&limit=24&currency=usd&token=base" | python3 -c "import sys,json;d=json.load(sys.stdin);L=d['data']['attributes']['ohlcv_list'];print('ohlcv', len(L), L[0][:5])"
          curl -s -o /dev/null -w "pool HTTP %{http_code}\n" "https://api.geckoterminal.com/api/v2/networks/hyperevm/pools/0x535f30f50ebda33575242c38b976e681d13db6fa"
      - name: coingecko platforms (the contract lookup)
        run: curl -s -o /dev/null -w "coins/nest-2 HTTP %{http_code}\n" "https://api.coingecko.com/api/v3/coins/nest-2?localization=false&tickers=false&market_data=false&community_data=false&developer_data=false"
